<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(newFetch) { currentFetch = newFetch; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var currentFetch = window.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return currentFetch; },
              set: function(newFetch) { currentFetch = newFetch; },
              configurable: true,
              enumerable: true
            });
          } catch (err) {
            console.warn("Unable to safeguard window.fetch:", err);
          }
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Manager</title>
    <link rel="icon" href="https://vibe.filesafe.space/1774574497340417071/attachments/4af9198a-5a06-416c-af59-eacac0979be2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; background-color: #020617;">
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #020617;
          color: #ffffff;
          font-family: 'Anek Bangla', 'Inter', -apple-system, sans-serif;
          user-select: none;
        }
        .initial-icon-box {
          position: relative;
          width: 80px;
          height: 80px;
          border-radius: 20px;
          background: linear-gradient(135deg, #3b82f6, #4f46e5);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 20px 35px -10px rgba(59, 130, 246, 0.4);
          margin-bottom: 24px;
        }
        .initial-compass {
          width: 40px;
          height: 40px;
          animation: spin 8s linear infinite;
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        .initial-bar {
          width: 220px;
          height: 5px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
          margin-top: 20px;
        }
        .initial-bar-fill {
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, #3b82f6, #818cf8, #22d3ee);
          border-radius: 9999px;
          animation: initProgress 1.6s ease-in-out infinite;
        }
        @keyframes initProgress {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(0%); }
          100% { transform: translateX(100%); }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-icon-box">
          <svg class="initial-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff;">
          Fleet <span style="color: #60a5fa;">Manager</span>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">
          লজিস্টিকস ও ট্রান্সপোর্ট সিস্টেম
        </div>
        <div class="initial-bar">
          <div class="initial-bar-fill"></div>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #cbd5e1; margin-top: 14px;">
          অ্যাপ্লিকেশন লোড হচ্ছে...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
